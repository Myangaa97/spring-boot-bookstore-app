<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{layout :: content}">
<head>
    <title>Welcome to Bookstore</title>
</head>
<body>
    <section class="hero">
        <h2>Welcome to Our Bookstore</h2>
        <p>Discover amazing books across various categories</p>
        <a th:href="@{/books}" class="btn btn-primary">Browse Books</a>
    </section>

    <section class="featured-books">
        <div class="section-header">
            <h3>Featured Books</h3>
            <a th:href="@{/books}" class="btn btn-secondary">View All</a>
        </div>
        <div class="book-grid" th:if="${books != null and not #lists.isEmpty(books)}">
            <article class="book-card" th:each="book : ${books}">
                <div class="book-cover">
                    <img th:if="${book.coverImageUrl}" th:src="${book.coverImageUrl}" th:alt="${book.title}">
                    <div th:unless="${book.coverImageUrl}" class="placeholder-cover">No Cover</div>
                </div>
                <div class="book-info">
                    <h4 th:text="${book.title}"></h4>
                    <p class="author" th:text="'by ' + ${book.author}"></p>
                    <p class="price" th:text="'$' + ${book.price}"></p>
                    <a th:href="@{/books/{id}(id=${book.id})}" class="btn btn-outline">View Details</a>
                </div>
            </article>
        </div>
        <p th:if="${books == null or #lists.isEmpty(books)}" class="text-center">No books available yet.</p>
    </section>
</body>
</html>
