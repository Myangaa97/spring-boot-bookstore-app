<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
	<title>Category Management</title>
	<link rel="stylesheet" href="/css/categories.css">
</head>
<body>
	<header class="header">
		<div class="container">
			<h1>Bookstore Admin</h1>
			<p>Category Management</p>
		</div>
	</header>
	<main class="container">
		<div id="message" class="message" hidden>

		</div>
		<!-- category form -->
		 <section class="card">
			<h2 id="form-title">Add Category</h2>
			<form id="category-form">
				<input type="hidden" id="category-id">
				<div class="form-group">
					<label for="category-name">Category name</label>
					<input type="text" id="category-name" placeholder="programming" required>
				</div>

				<div class="form-buttons">
					<button type="submit" id="submit-button" class="button primary">Add Category</button>
					<button type="button" id="cancel-button" class="button secondary" hidden>Cancel</button>
				</div>
			</form>
		 </section>

		 <section class="card">
			<div class="section-header">
				<h2>Categories</h2>
				<button id="refresh-button" class="button secondary">Refresh</button>
			</div>
			<div class="table-container">
				<table>
					<thead>
						<tr>
							<th>ID</th>
							<th>Name</th>
							<th>Actions</th>
						</tr>
					</thead>
					<tbody id="category-table-body">

					</tbody>
				</table>
			</div>
		 </section>
	</main>
	<script
        defer
        th:src="@{/js/categories.js}">
    </script>
</body>
</html>
