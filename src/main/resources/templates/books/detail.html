<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{layout :: content}">
<head>
    <title th:text="${book.title}">Book Details</title>
</head>
<body>
    <section class="book-detail">
        <a th:href="@{/books}" class="btn btn-outline btn-back">← Back to Books</a>

        <div class="detail-card">
            <div class="detail-cover">
                <img th:if="${book.coverImageUrl}" th:src="${book.coverImageUrl}" th:alt="${book.title}">
                <div th:unless="${book.coverImageUrl}" class="placeholder-cover large">No Cover</div>
            </div>

            <div class="detail-info">
                <h2 th:text="${book.title}"></h2>
                <p class="author" th:text="'by ' + ${book.author}"></p>

                <div class="meta">
                    <span class="badge" th:if="${book.category}" th:text="${book.category.name}"></span>
                    <span th:if="${book.isbn}" class="meta-item">ISBN: <strong th:text="${book.isbn}"></strong></span>
                    <span th:if="${book.publishedYear}" class="meta-item">Published: <strong th:text="${book.publishedYear}"></strong></span>
                    <span class="meta-item">Stock: <strong th:text="${book.stock}"></strong></span>
                    <span class="meta-item price">$<strong th:text="${book.price}"></strong></span>
                </div>

                <div class="description" th:if="${book.description}">
                    <h4>Description</h4>
                    <p th:text="${book.description}"></p>
                </div>

                <div class="detail-actions">
                    <a th:href="@{/books/{id}/edit(id=${book.id})}" class="btn btn-secondary">Edit</a>
                    <form th:action="@{/books/{id}/delete(id=${book.id})}" method="post" class="inline-form" onsubmit="return confirm('Are you sure you want to delete this book?')">
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
