<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{layout :: content}">
<head>
    <title th:text="${book.id != null} ? 'Edit Book' : 'Add New Book'">Add Book</title>
</head>
<body>
    <section class="book-form">
        <h3 th:text="${book.id != null} ? 'Edit Book' : 'Add New Book'"></h3>

        <form th:action="${book.id != null} ? @{/books/{id}(id=${book.id})} : @{/books}" method="post" th:object="${book}" class="form">
            <input type="hidden" name="id" th:value="${book.id}">

            <div class="form-group">
                <label for="title">Title <span class="required">*</span></label>
                <input type="text" id="title" name="title" th:field="*{title}" required>
                <div class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>

            <div class="form-group">
                <label for="author">Author <span class="required">*</span></label>
                <input type="text" id="author" name="author" th:field="*{author}" required>
                <div class="error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></div>
            </div>

            <div class="form-group">
                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" name="isbn" th:field="*{isbn}" maxlength="13" placeholder="13-digit ISBN">
                <div class="error" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="price">Price <span class="required">*</span></label>
                    <input type="number" id="price" name="price" th:field="*{price}" step="0.01" min="0.01" required>
                    <div class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                </div>

                <div class="form-group">
                    <label for="stock">Stock <span class="required">*</span></label>
                    <input type="number" id="stock" name="stock" th:field="*{stock}" min="0" required>
                    <div class="error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="publishedYear">Published Year</label>
                <input type="number" id="publishedYear" name="publishedYear" th:field="*{publishedYear}" min="1000" max="2099" placeholder="e.g., 2024">
                <div class="error" th:if="${#fields.hasErrors('publishedYear')}" th:errors="*{publishedYear}"></div>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" th:field="*{category}">
                    <option value="">Select a category</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                </select>
                <div class="error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
            </div>

            <div class="form-group">
                <label for="coverImageUrl">Cover Image URL</label>
                <input type="url" id="coverImageUrl" name="coverImageUrl" th:field="*{coverImageUrl}" placeholder="https://example.com/cover.jpg">
                <div class="error" th:if="${#fields.hasErrors('coverImageUrl')}" th:errors="*{coverImageUrl}"></div>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" th:field="*{description}" rows="5" placeholder="Book description..."></textarea>
                <div class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" th:text="${book.id != null} ? 'Update Book' : 'Create Book'"></button>
                <a th:href="@{/books}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </section>
</body>
</html>
